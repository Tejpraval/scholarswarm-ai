services:
  - type: web
    name: scholarswarm-ai-api
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DB_PATH
        value: scholarswarm.db
      - key: UPLOAD_DIR
        value: uploads
